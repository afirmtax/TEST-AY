<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문방구 점심 뽑기</title>
<style>
  :root {
    --bg: #fff3dc;
    --card: #ffffff;
    --text: #3b2f2f;
    --accent: #ff6b35;
    --muted: #9a8c84;
    --border: #f0e2d2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .app { width: 100%; max-width: 520px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

  canvas {
    width: min(100%, 480px);
    aspect-ratio: 480 / 660;
    height: auto;
    display: block;
    margin: 0 auto;
  }

  #spin {
    margin-top: 6px;
    padding: 14px 44px;
    font-size: 20px; font-weight: 700; font-family: inherit;
    color: #fff; background: var(--accent);
    border: none; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 5px 0 #c9481b;
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  #spin:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #c9481b; }
  #spin:disabled { opacity: .5; cursor: not-allowed; }

  .result {
    margin: 22px auto 0;
    min-height: 74px;
    padding: 14px 18px;
    background: var(--card);
    border: 2px dashed var(--border);
    border-radius: 16px;
    font-size: 15px; color: var(--muted);
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
  }
  .result strong { font-size: 30px; color: var(--accent); }
  .result.win { border-style: solid; border-color: var(--accent); animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .panel {
    margin-top: 28px; padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    text-align: left;
  }
  summary { cursor: pointer; font-weight: 700; font-size: 16px; padding: 4px 0; }
  .grid {
    margin-top: 12px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .cell { display: flex; align-items: center; gap: 6px; }
  .cell span { width: 22px; text-align: right; font-size: 12px; color: var(--muted); flex: none; }
  .cell input {
    width: 100%; min-width: 0; padding: 7px 10px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  .cell input:focus { border-color: var(--accent); }
  .cell input:disabled { background: #f6f1ea; }
  .tools { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hint { font-size: 12px; color: var(--muted); }
  .btn {
    padding: 8px 14px; font-size: 13px; font-family: inherit;
    border-radius: 10px; cursor: pointer; flex: none;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <h1>🎱 오늘 점심 뭐 먹지?</h1>
  <p class="sub">문방구 뽑기 기계를 돌려서 오늘의 점심을 뽑아보세요</p>

  <canvas id="machine"></canvas>

  <button id="spin">돌리기!</button>

  <div class="result" id="result">버튼을 눌러 점심 메뉴를 뽑아보세요</div>

  <details class="panel">
    <summary>🍽 메뉴 30개 보기 / 수정</summary>
    <div class="grid" id="grid"></div>
    <div class="tools">
      <span class="hint">공 30개 = 메뉴 30개 (이름만 바꿀 수 있어요)</span>
      <button class="btn" id="reset" type="button">기본 메뉴로 초기화</button>
    </div>
  </details>
</div>

<script>
(function () {
  var DEFAULTS = [
    "김치찌개", "된장찌개", "부대찌개", "순두부찌개", "제육볶음",
    "불고기", "비빔밥", "김밥", "돈까스", "짜장면",
    "짬뽕", "볶음밥", "칼국수", "냉면", "쌀국수",
    "초밥", "라멘", "햄버거", "피자", "파스타",
    "샐러드", "샌드위치", "순대국", "설렁탕", "갈비탕",
    "닭갈비", "떡볶이", "마라탕", "쭈꾸미볶음", "오므라이스"
  ];
  var COLORS = ["#ff5a4f", "#ffb627", "#5cc34a", "#27c4b5", "#4d96ff", "#a15cf0", "#ff5fb4", "#ff8a3d"];
  var STORE_KEY = "lunch-gacha-items-v2";
  var TWO_PI = Math.PI * 2;
  var COUNT = 30;

  // 캔버스 논리 좌표
  var W = 480, H = 660;
  var CX = 240, CY = 195, R = 172;      // 유리 돔
  var BALL_R = 20, OUT_R = 33;
  var OUTLET = { x: 185, y: 522, w: 110, h: 72 };
  var DROP_START = 530, FLOOR = 556;
  var G = 0.28;
  var MIX_STEPS = 270;      // 섞는 시간 (약 4.5초)
  var OMEGA = 0.032;        // 소용돌이 회전 속도

  var canvas = document.getElementById("machine");
  var ctx = canvas.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  var spinBtn = document.getElementById("spin");
  var resultEl = document.getElementById("result");
  var gridEl = document.getElementById("grid");
  var resetBtn = document.getElementById("reset");

  var items = load();
  var balls = [];
  var phase = "idle";   // idle | mixing | drawing | done
  var picked = null;
  var phaseSteps = 0;
  var knobAngle = 0, knobSpeed = 0;
  var shake = 0;
  // 섞기 동안 수시로 바뀌는 무작위 힘
  var swirl = 0, swirlTarget = 0, nextChange = 0;
  var jetX = 240, jetPower = 1, gustX = 0, gustY = 0;

  function load() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORE_KEY));
      if (Array.isArray(saved) && saved.length === COUNT) return saved;
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(items)); } catch (e) {}
  }
  function busy() { return phase === "mixing" || phase === "drawing"; }

  /* ---------- 공 만들기 ---------- */
  function makeBalls() {
    balls = [];
    for (var i = 0; i < COUNT; i++) {
      var a = Math.random() * TWO_PI, d = Math.sqrt(Math.random()) * (R - 40);
      balls.push({
        idx: i,
        color: COLORS[i % COLORS.length],
        r: BALL_R,
        x: CX + Math.cos(a) * d,
        y: CY + Math.sin(a) * d * 0.8,
        vx: 0, vy: 0,
        angle: Math.random() * TWO_PI,
        state: "in", timer: 0
      });
    }
    phase = "idle";
    picked = null;
    for (var k = 0; k < 160; k++) step();   // 미리 바닥에 쌓아두기
  }

  /* ---------- 물리 ---------- */
  // 통 안 임의의 지점에서 공들이 사방으로 튀어 나가는 폭발
  function burst() {
    var a = Math.random() * TWO_PI, d = Math.random() * R * 0.6;
    var px = CX + Math.cos(a) * d, py = CY + Math.sin(a) * d;
    var power = 3 + Math.random() * 4;
    balls.forEach(function (b) {
      if (b.state !== "in") return;
      var dx = b.x - px, dy = b.y - py, dd = Math.hypot(dx, dy) || 1;
      if (dd < 110) {
        var f = power * (1 - dd / 110);
        b.vx += dx / dd * f;
        b.vy += dy / dd * f;
      }
    });
  }

  function step() {
    var i, j, b, n = balls.length;

    if (phase === "mixing") {
      phaseSteps++;
      knobSpeed = 0.16;
      if (phaseSteps >= nextChange) {
        // 회전 방향·세기, 바람 위치, 돌풍 방향을 무작위로 바꾼다
        swirlTarget = (Math.random() < 0.5 ? -1 : 1) * (0.3 + Math.random() * 1.0) * OMEGA;
        nextChange = phaseSteps + 20 + Math.random() * 40;
        jetX = CX + (Math.random() - 0.5) * R * 1.3;
        jetPower = 0.5 + Math.random() * 1.0;
        gustX = (Math.random() - 0.5) * 0.5;
        gustY = (Math.random() - 0.5) * 0.5;
        if (Math.random() < 0.6) burst();
      }
      swirl += (swirlTarget - swirl) * 0.06;
      if (Math.random() < 0.03) burst();
      if (phaseSteps > MIX_STEPS) {
        picked = balls[Math.floor(Math.random() * n)];
        phase = "drawing";
        phaseSteps = 0;
        resultEl.className = "result";
        resultEl.textContent = "공이 나온다... 🥁";
      }
    } else if (phase === "drawing") {
      phaseSteps++;
      if (picked && picked.state === "in" && phaseSteps > 480) {
        picked.state = "falling";
        picked.x = CX; picked.y = CY + R - picked.r; picked.vx = 0; picked.vy = 0;
      }
    }
    knobAngle += knobSpeed;
    knobSpeed *= 0.97;
    if (shake > 0) shake--;

    for (i = 0; i < n; i++) {
      b = balls[i];
      if (b.state === "in") {
        // 섞는 동안은 중력을 줄이고, 돔 안을 빙글빙글 도는 소용돌이를 만든다
        var mixK = 0;
        if (phase === "mixing") {
          mixK = Math.max(0, Math.min(1, phaseSteps / 30, (MIX_STEPS - phaseSteps) / 25));
        }
        b.vy += G * (1 - 0.8 * mixK);
        if (mixK > 0) {
          var mdx = b.x - CX, mdy = b.y - CY;
          // 시시각각 바뀌는 회전 (방향도 뒤집힘)
          b.vx += (-mdy * swirl - b.vx) * 0.05 * mixK;
          b.vy += (mdx * swirl - b.vy) * 0.05 * mixK;
          // 위치가 계속 바뀌는 바람구멍
          if (Math.abs(b.x - jetX) < 55 && mdy > -40) b.vy -= jetPower * (0.5 + Math.random() * 0.6) * mixK;
          // 무작위 방향의 돌풍
          b.vx += gustX * mixK;
          b.vy += gustY * mixK;
          // 안쪽으로 살짝 당김 (벽에만 붙지 않도록)
          b.vx -= mdx / R * 0.05 * mixK;
          b.vy -= mdy / R * 0.05 * mixK;
          // 불규칙한 흔들림
          b.vx += (Math.random() - 0.5) * 0.6 * mixK;
          b.vy += (Math.random() - 0.5) * 0.6 * mixK;
        }
        if (b === picked && phase === "drawing") {
          b.vy += 0.2;
          b.vx += (CX - b.x) * 0.02;
          b.vx *= 0.94;
        }
        b.vx *= 0.995; b.vy *= 0.995;
        var sp = Math.hypot(b.vx, b.vy);
        if (sp > 14) { b.vx *= 14 / sp; b.vy *= 14 / sp; }
        b.x += b.vx; b.y += b.vy;
        b.angle += b.vx * 0.04;
      } else if (b.state === "falling") {
        b.vy += 0.5;
        b.y += b.vy;
        b.x += (CX - b.x) * 0.35;
        if (b.y > 400) { b.state = "chute"; b.timer = 20; shake = 14; }
      } else if (b.state === "chute") {
        b.timer--;
        if (b.timer <= 0) {
          b.state = "drop"; b.x = CX; b.y = DROP_START; b.vy = 0; b.vx = 0;
          shake = 8;
        }
      } else if (b.state === "drop") {
        b.vy += 0.5;
        b.y += b.vy;
        if (b.y >= FLOOR) {
          b.y = FLOOR;
          if (Math.abs(b.vy) > 3) {
            b.vy = -b.vy * 0.4;
          } else {
            b.vy = 0;
            b.state = "out";
            finish();
          }
        }
      } else if (b.state === "out") {
        b.r += (OUT_R - b.r) * 0.12;
      }
    }

    // 공끼리 충돌 (2회 반복)
    for (var it = 0; it < 2; it++) {
      for (i = 0; i < n; i++) {
        var a = balls[i];
        if (a.state !== "in" || (a === picked && phase === "drawing")) continue;
        for (j = i + 1; j < n; j++) {
          var c = balls[j];
          if (c.state !== "in" || (c === picked && phase === "drawing")) continue;
          var dx = c.x - a.x, dy = c.y - a.y;
          var minD = a.r + c.r;
          var d2 = dx * dx + dy * dy;
          if (d2 >= minD * minD) continue;
          var d = Math.sqrt(d2) || 0.01;
          var nx = dx / d, ny = dy / d;
          var ov = (minD - d) / 2;
          a.x -= nx * ov; a.y -= ny * ov;
          c.x += nx * ov; c.y += ny * ov;
          var vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
          if (vn < 0) {
            var imp = -(1 + 0.8) * vn / 2;
            a.vx -= imp * nx; a.vy -= imp * ny;
            c.vx += imp * nx; c.vy += imp * ny;
          }
        }
      }
    }

    // 유리 돔 벽
    for (i = 0; i < n; i++) {
      b = balls[i];
      if (b.state !== "in") continue;
      var wx = b.x - CX, wy = b.y - CY;
      var wd = Math.hypot(wx, wy) || 0.01;
      var lim = R - b.r - 3;
      if (wd > lim) {
        var wnx = wx / wd, wny = wy / wd;
        b.x = CX + wnx * lim; b.y = CY + wny * lim;
        var v = b.vx * wnx + b.vy * wny;
        if (v > 0) { b.vx -= 1.6 * v * wnx; b.vy -= 1.6 * v * wny; }
      }
    }

    // 뽑힌 공이 배출구에 도달하면 아래로
    if (phase === "drawing" && picked && picked.state === "in") {
      if (picked.y >= CY + R - picked.r - 6 && Math.abs(picked.x - CX) < 10) {
        picked.state = "falling";
        picked.vx = 0; picked.vy = Math.max(picked.vy, 1);
      }
    }
  }

  function finish() {
    phase = "done";
    resultEl.className = "result win";
    resultEl.innerHTML = "오늘의 점심은<strong></strong>";
    resultEl.querySelector("strong").textContent = "🎉 " + items[picked.idx] + " 🎉";
    syncUI();
  }

  /* ---------- 그리기 ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 캡슐(반반 색) 공 — 이름은 표시하지 않음
  function drawBall(b) {
    var r = b.r;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    ctx.beginPath(); ctx.arc(0, 0, r, Math.PI, TWO_PI); ctx.closePath();
    ctx.fillStyle = b.color; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI); ctx.closePath();
    ctx.fillStyle = "#f6f1e7"; ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    ctx.fillRect(-r, -1.3, r * 2, 2.6);
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, TWO_PI);
    var shade = ctx.createRadialGradient(b.x - r * 0.3, b.y - r * 0.35, r * 0.2, b.x, b.y, r);
    shade.addColorStop(0, "rgba(255,255,255,0)");
    shade.addColorStop(1, "rgba(0,0,0,0.3)");
    ctx.fillStyle = shade; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(b.x - r * 0.38, b.y - r * 0.42, r * 0.28, r * 0.16, -0.7, 0, TWO_PI);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.fill();
    ctx.restore();
  }

  function drawGlobeBack() {
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TWO_PI);
    var gg = ctx.createRadialGradient(CX - 60, CY - 80, 20, CX, CY, R);
    gg.addColorStop(0, "rgba(255,255,255,0.9)");
    gg.addColorStop(0.55, "rgba(214,236,255,0.6)");
    gg.addColorStop(1, "rgba(150,195,235,0.55)");
    ctx.fillStyle = gg;
    ctx.fill();
  }

  function drawGlobeFront() {
    ctx.beginPath();
    ctx.arc(CX, CY, R, 0, TWO_PI);
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#9fc0de";
    ctx.stroke();
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.arc(CX, CY, R - 16, Math.PI * 1.08, Math.PI * 1.38);
    ctx.lineWidth = 10;
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(CX, CY, R - 16, Math.PI * 1.46, Math.PI * 1.5);
    ctx.stroke();
    ctx.lineCap = "butt";

    // 위 뚜껑
    rr(196, 4, 88, 26, 12);
    var cap = ctx.createLinearGradient(0, 4, 0, 30);
    cap.addColorStop(0, "#ff6b6b");
    cap.addColorStop(1, "#c92a2a");
    ctx.fillStyle = cap; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#8f1a25"; ctx.stroke();
  }

  function drawBody() {
    // 받침(다리)
    rr(72, 592, 336, 44, 16);
    ctx.fillStyle = "#7a1620"; ctx.fill();

    // 돔 받침 링
    rr(100, 356, 280, 34, 14);
    var ring = ctx.createLinearGradient(0, 356, 0, 390);
    ring.addColorStop(0, "#f2f2f2");
    ring.addColorStop(0.5, "#b9bec7");
    ring.addColorStop(1, "#8a909b");
    ctx.fillStyle = ring; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#6c727d"; ctx.stroke();

    // 본체
    rr(90, 384, 300, 216, 26);
    var bg = ctx.createLinearGradient(0, 384, 0, 600);
    bg.addColorStop(0, "#ff5d5d");
    bg.addColorStop(1, "#c4232f");
    ctx.fillStyle = bg; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#8f1a25"; ctx.stroke();

    // 옆 하이라이트
    rr(100, 400, 10, 170, 5);
    ctx.fillStyle = "rgba(255,255,255,0.25)"; ctx.fill();

    // 상단 간판
    rr(150, 394, 180, 28, 10);
    ctx.fillStyle = "#fff3c4"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#8f1a25"; ctx.stroke();
    ctx.fillStyle = "#c4232f";
    ctx.font = "800 17px 'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("문방구 뽑기", CX, 409);

    // 동전 투입구 (왼쪽)
    rr(108, 436, 58, 78, 8);
    ctx.fillStyle = "#dcdcdc"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#7a7a7a"; ctx.stroke();
    rr(131, 450, 12, 32, 6);
    ctx.fillStyle = "#222"; ctx.fill();
    ctx.fillStyle = "#333";
    ctx.font = "700 13px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText("500원", 137, 498);

    // 스티커 (오른쪽)
    ctx.save();
    ctx.translate(342, 474);
    ctx.rotate(-0.1);
    rr(-30, -34, 60, 68, 8);
    ctx.fillStyle = "#ffe066"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#c99a00"; ctx.stroke();
    ctx.fillStyle = "#6b4a00";
    ctx.font = "800 14px 'Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    ctx.fillText("오늘의", 0, -8);
    ctx.fillText("점심", 0, 12);
    ctx.restore();

    // 돌림 손잡이 (가운데)
    ctx.beginPath();
    ctx.arc(CX, 468, 46, 0, TWO_PI);
    ctx.fillStyle = "#fff3c4"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = "#8f1a25"; ctx.stroke();
    ctx.save();
    ctx.translate(CX, 468);
    ctx.rotate(knobAngle);
    rr(-40, -13, 80, 26, 13);
    ctx.fillStyle = "#ffc400"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#b88600"; ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, 9, 0, TWO_PI);
    ctx.fillStyle = "#8a909b"; ctx.fill();
    ctx.restore();

    // 배출구
    rr(OUTLET.x - 6, OUTLET.y - 6, OUTLET.w + 12, OUTLET.h + 12, 16);
    ctx.fillStyle = "#8f1a25"; ctx.fill();
    rr(OUTLET.x, OUTLET.y, OUTLET.w, OUTLET.h, 12);
    ctx.fillStyle = "#2b1a1a"; ctx.fill();
  }

  function drawFlap() {
    // 배출구 앞 투명 덮개
    rr(OUTLET.x, OUTLET.y + 42, OUTLET.w, 30, 10);
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.stroke();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
    else if (phase === "mixing") ctx.translate((Math.random() - 0.5) * 2, (Math.random() - 0.5) * 2);

    drawGlobeBack();
    for (var i = 0; i < balls.length; i++) {
      var s = balls[i].state;
      if (s === "in" || s === "falling") drawBall(balls[i]);
    }
    drawGlobeFront();
    drawBody();
    for (var k = 0; k < balls.length; k++) {
      var t = balls[k].state;
      if (t === "drop" || t === "out") drawBall(balls[k]);
    }
    drawFlap();
    ctx.restore();
  }

  /* ---------- UI ---------- */
  function buildInputs() {
    gridEl.innerHTML = "";
    items.forEach(function (name, idx) {
      var cell = document.createElement("label");
      cell.className = "cell";
      var num = document.createElement("span");
      num.textContent = String(idx + 1);
      var inp = document.createElement("input");
      inp.type = "text";
      inp.maxLength = 12;
      inp.value = name;
      inp.addEventListener("input", function () {
        items[idx] = inp.value.trim() || DEFAULTS[idx];
        save();
      });
      inp.addEventListener("blur", function () {
        if (!inp.value.trim()) inp.value = DEFAULTS[idx];
      });
      cell.appendChild(num);
      cell.appendChild(inp);
      gridEl.appendChild(cell);
    });
  }

  function syncUI() {
    var b = busy();
    spinBtn.disabled = b;
    resetBtn.disabled = b;
    Array.prototype.forEach.call(gridEl.querySelectorAll("input"), function (inp) { inp.disabled = b; });
  }

  function spin() {
    if (busy()) return;
    // 이전에 뽑힌 공은 다시 통 안으로
    balls.forEach(function (b) {
      if (b.state !== "in") {
        b.state = "in";
        b.r = BALL_R;
        b.x = CX + (Math.random() - 0.5) * 80;
        b.y = CY - R * 0.6;
        b.vx = (Math.random() - 0.5) * 3;
        b.vy = 0;
      }
    });
    picked = null;
    phase = "mixing";
    phaseSteps = 0;
    swirl = 0; swirlTarget = 0; nextChange = 0;
    resultEl.className = "result";
    resultEl.textContent = "공을 섞는 중... 🌀";
    syncUI();
  }

  resetBtn.addEventListener("click", function () {
    if (busy()) return;
    items = DEFAULTS.slice();
    save();
    buildInputs();
    syncUI();
  });

  spinBtn.addEventListener("click", spin);

  /* ---------- 루프 ---------- */
  var STEP_MS = 1000 / 60, acc = 0, last = performance.now();
  function loop(now) {
    acc += Math.min(100, now - last);
    last = now;
    while (acc >= STEP_MS) { step(); acc -= STEP_MS; }
    draw();
    requestAnimationFrame(loop);
  }

  buildInputs();
  makeBalls();
  syncUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
